[package]
name = "famt"
version = "0.1.0"
edition = "2021"
authors = ["7109jun"]
description = "A fast and modern typed language with JIT compilation"
license = "MIT"

[lib]
name = "famt"
path = "src/lib.rs"

[[bin]]
name = "famt"
path = "src/main.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
